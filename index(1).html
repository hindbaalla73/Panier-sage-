@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a15;--card:#15261f;--ink:#e6f2ec;--mut:#8fa99d;--line:#24382f;--pri:#4fd1a0;--pri2:#173b2e;--hero:#0f3d2e;--warn:#f0b04a;--warn2:#3a2d12;--bad:#ff8479;--bad2:#3d1d1a;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a15;--card:#15261f;--ink:#e6f2ec;--mut:#8fa99d;--line:#24382f;--pri:#4fd1a0;--pri2:#173b2e;--hero:#0f3d2e;--warn:#f0b04a;--warn2:#3a2d12;--bad:#ff8479;--bad2:#3d1d1a;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
#app{max-width:720px;margin:0 auto;padding:14px 16px 100px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top h1{font-size:20px;flex:1}.top small{color:var(--mut);display:block;font:500 12px "DM Sans"}
.logo{width:38px;height:38px;border-radius:12px;background:var(--pri);display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.b{font-weight:700}.m{color:var(--mut);font-size:13px}
.hero{background:var(--hero);color:#fff;border-radius:24px;display:flex;align-items:center;overflow:hidden;margin-bottom:12px}
.hero div{padding:24px 0 24px 20px;flex:1}.hero h2{font-size:26px;line-height:1.1}.hero p{margin:6px 0 0;opacity:.8;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stats .card{margin:0;padding:12px}.stats b{font:800 22px "Bricolage Grotesque"}.stats span{display:block;font-size:12px;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font:700 13px "DM Sans";cursor:pointer}.chip.on{background:var(--pri);border-color:var(--pri);color:var(--card)}
.ci{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}.ci svg{width:23px;height:23px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.ok{background:var(--pri2);color:var(--pri)}.warn{background:var(--warn2);color:var(--warn)}.bad{background:var(--bad2);color:var(--bad)}
.btn{border:0;border-radius:12px;padding:11px 16px;font:700 14px "DM Sans";background:var(--pri);color:var(--card);cursor:pointer}.btn.g{background:var(--pri2);color:var(--pri)}.btn.r{background:var(--bad2);color:var(--bad)}.btn.s{padding:7px 11px;font-size:13px}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%}
label{font-size:12px;font-weight:700;color:var(--mut);display:block;margin-bottom:4px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}.empty svg{width:140px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.day{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;align-items:center;margin-bottom:8px}.day b{font-size:13px}.day input{padding:8px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font:700 11px "DM Sans";display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;position:relative;cursor:pointer}
nav button.on{color:var(--pri)}nav svg{width:24px;height:24px}nav em{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font:700 10px "DM Sans";border-radius:9px;padding:1px 5px;font-style:normal}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;z-index:10}
h3{font-size:17px;margin:16px 0 8px}:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.L h1{font-size:36px;line-height:1.04;color:#fff}.L h3{font-size:22px;margin:26px 0 12px}
.lh{border-radius:28px;min-height:470px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;color:#fff;background:linear-gradient(180deg,rgba(5,38,27,.05) 15%,rgba(5,38,27,.93)),var(--i2) 40% 50%/cover;margin-bottom:14px}
.lh p{margin:10px 0 18px;opacity:.92}.bdg{align-self:flex-start;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border-radius:99px;padding:5px 12px;font-weight:700;font-size:12px;margin-bottom:12px}
.cta{background:#7fe0b0;color:#06281c;border:0;border-radius:14px;padding:15px 22px;font:800 16px "DM Sans";cursor:pointer;width:100%}
.ph2{aspect-ratio:16/9;border-radius:24px;background:var(--i1) center/cover;box-shadow:var(--sh)}
.fg,.pr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fc{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.fc i{display:block;height:120px}.fc div{padding:12px}.fc b{font:700 15px "Bricolage Grotesque"}.fc p{margin:4px 0 0;font-size:13px;color:var(--mut)}
.st{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}.st span{width:34px;height:34px;border-radius:50%;background:var(--pri);color:var(--card);display:grid;place-items:center;font-weight:800;flex:none}
.pr .card{margin:0}.pr .hot{background:var(--hero);color:#fff;border-color:var(--hero)}.pr .p{font:800 28px "Bricolage Grotesque"}.pr ul{padding-left:18px;margin:10px 0 14px;font-size:13px}
.fin{border-radius:28px;padding:30px 20px;text-align:center;background:linear-gradient(rgba(247,251,247,.86),rgba(247,251,247,.86)),var(--i4) center/cover;color:#112a21;margin-top:20px}.fin h3{margin:0 0 6px;color:#112a21}
.th{width:58px;height:58px;border-radius:15px;flex:none}.top{padding-right:62px}
.hero{background-size:cover;background-position:center;min-height:170px;position:relative;color:#fff}
.hero.cov{aspect-ratio:16/9;min-height:0}.hero div{background:none}
.hero.dk{background-image:linear-gradient(90deg,rgba(5,38,27,.88) 15%,rgba(5,38,27,.1)),var(--im)}
.hero.lt{background-image:linear-gradient(90deg,rgba(247,251,247,.94) 25%,rgba(247,251,247,0)),var(--im);color:#112a21}
.hero div{max-width:62%}.empty .ph{width:220px;height:124px;margin:0 auto 6px;border-radius:16px;background:var(--im) center/cover}

shop:[['Bananes',1,'kg','veg',2.2],['Riz basmati',1,'kg','grocery',2.9]].map(a=>({id:id(),name:a[0],qty:a[1],unit:a[2],cat:a[3],price:a[4],bought:false})),

function vShop(){const T=S.shop.reduce((a,s)=>a+s.price,0),n=S.shop.filter(s=>s.bought).length;

<form class="card" id="sf"><div class="g2"><div><label>Article</label><input name="n" required placeholder="Ex. Beurre"></div><div><label>Prix estimé (€)</label><input name="p" type="number" step="0.01" min="0" value="2"></div></div><button class="btn" style="width:100%">Ajouter à la liste</button></form>
${S.shop.length?S.shop.map(s=>`<div class="card"><div class="row"><input type="checkbox" style="width:22px;height:22px" data-a="tick" data-i="${s.id}" ${s.bought?'checked':''}>${ic(s.cat)}<div class="grow"><div class="b" style="${s.bought?'text-decoration:line-through;opacity:.55':''}">${esc(s.name)}</div><div class="m">${s.qty} ${s.unit} · ${eur(s.price)}</div></div><button class="btn r s" data-a="sdel" data-i="${s.id}" aria-label="Supprimer">✕</button></div></div>`).join(''):empty('Votre liste est vide.')}
${n?`<button class="btn" style="width:100%" data-a="stockin">Ranger ${n} article${n>1?'s':''} au stock</button>`:''}`}

<div class="card"><div class="row"><div class="grow"><div class="b">Dépensé : ${eur(b.spent)}</div><div class="m">sur un budget de</div></div><input type="number" min="0" style="width:110px" data-b="monthly" value="${b.monthly}"></div><div class="bar" style="margin-top:12px"><i style="width:${p}%;background:var(--${p>90?'bad':'pri'})"></i></div></div>
<div class="card row"><svg width="110" height="110" viewBox="0 0 100 100" style="transform:rotate(-90deg)"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--pri)" stroke-width="14"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--bad)" stroke-width="14" stroke-dasharray="${w*C} ${C}"/></svg><div class="grow"><div class="b" style="color:var(--pri)">${eur(b.saved)} consommés à temps</div><div class="b" style="color:var(--bad);margin-top:6px">${eur(b.wasted)} jetés</div><div class="m" style="margin-top:6px">${tot?Math.round((1-w)*100)+' % de votre stock sorti a été consommé.':'Marquez vos produits comme consommés ou jetés.'}</div></div></div>`}
function vAlerts(){const g=(l,f,c)=>{const L=S.stock.filter(s=>f(dl(s.exp))).sort((a,b)=>a.exp.localeCompare(b.exp));return L.length?`<h3>${l}</h3>`+L.map(s=>`<div class="card"><div class="row">${ic(s.cat)}<div class="grow"><div class="b">${esc(s.name)}</div><div class="m">${s.qty} ${s.unit} · ${LOC[s.loc]}</div></div><span class="pill ${c}">${st(s.exp)[1]}</span></div><div class="acts"><button class="btn g s" data-a="eat" data-i="${s.id}">Consommé</button><button class="btn r s" data-a="waste" data-i="${s.id}">Jeté</button></div></div>`).join(''):''};
const h=g('Périmés',d=>d<0,'bad')+g('À consommer sous 3 jours',d=>d>=0&&d<=3,'warn')+g('Cette semaine',d=>d>3&&d<=7,'ok');
return `<div class="hero lt" style="--im:var(--i4)"><div><h2>Alertes</h2><p>Ce qu’il faut utiliser en priorité.</p></div></div>${h||empty('Tout est frais. Aucune alerte pour le moment.')}`}
const vLand=()=>`<div class="L"><div class="lh"><span class="bdg">Anti-gaspi · Repas · Budget</span><h1>Cuisinez malin.<br>Mangez frais.</h1><p>Panier Sage suit votre frigo, vous prévient avant que les aliments périment et propose des repas avec ce que vous avez déjà.</p><button class="cta" data-a="start">Commencer</button></div>
<div class="ph2" role="img" aria-label="Application Panier Sage sur téléphone"></div>
<h3>Une cuisine sans gaspillage</h3><div class="fg">${[['Stock vivant','Frigo, congélateur, placard : chaque produit avec sa date limite.','var(--i1) 55% 72%/260%'],['Recettes anti-gaspi','Des idées de repas selon ce qui périme bientôt.','var(--i2) 50% 75%/230%'],['Courses sans oubli','Rachetez en un geste et rangez au retour du magasin.','var(--i3) center/cover'],['Budget clair','Voyez ce que vous économisez et ce que vous jetez.','var(--i4) 50% 55%/200%']].map(f=>`<div class="fc"><i style="background:${f[2]}"></i><div><b>${f[0]}</b><p>${f[1]}</p></div></div>`).join('')}</div>

const IC={stock:'<path d="M4 8l8-4 8 4v10l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v10"/>',meals:'<path d="M7 3v8m-3-8v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-3 2-4 6-4 9h4"/>',shop:'<path d="M3 4h3l2 12h10l2-8H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/>',budget:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/>',alerts:'<path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/>'};

const find=(a,x)=>a.find(s=>s.id==x);
